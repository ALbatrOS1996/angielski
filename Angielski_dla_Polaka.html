<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angielski</title>
<meta name="description" content="Angielski dla Polaków od poziomu B1 do C2 oraz ścieżki Podróż i Archiwum i historia od podstaw: trening z automatycznym sprawdzaniem, słuchanie, wymowa, czasowniki nieregularne, dialogi.">
<meta name="theme-color" content="#081a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angielski">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Crect y='27' width='32' height='5' fill='%23f59e0b'/%3E%3Ctext x='16' y='21' font-family='Georgia' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EEn%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   UKRAIŃSKI DLA POLAKA – system wizualny
   Paleta: kobalt i pszeniczne złoto, akcent czerwieni haftu (вишива́нка).
   Czcionki: Nunito (interfejs) + Lora (ukraińskie słowa) – obie z cyrylicą.
   ============================================================ */
/* Motyw czarno-fioletowy (domyślny) – tokeny w stylu shadcn: tła zinc/violet, akcent fioletowy, kontrast tekstu ≥ 4.5:1 */
:root, :root[data-theme="dark"] {
  --bg: #081a1c; --bg2: #0c2427; --surface: #0f2629; --surface2: #143034; --ink: #ecfdf5; --muted: #9dbdb8; --line: #1f3d40; --line2: #2b5357;
  --primary: #2dd4bf; --primary-d: #5eead4; --primary-soft: #0f3b3a; --on-primary: #04211f; --fill: #0d9488;
  --gold: #fbbf24; --gold-l: #f59e0b; --gold-soft: #3a2a07;
  --red: #fb7185; --red-soft: #3b1220;
  --ok: #4ade80; --ok-soft: #0f2e1d; --bad: #fb7185; --bad-soft: #3b1220; --mid: #fbbf24; --mid-soft: #3a2a07;
  --st: #fbbf24; --g-die: #fb7185;
  --glow: radial-gradient(1200px 600px at 85% -10%, rgba(13, 148, 136, .24), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(245, 158, 11, .12), transparent 60%);
  --sans: 'Nunito', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --serif: 'Crimson Pro', Georgia, 'Times New Roman', serif;
  --clay: 0 2px 0 #030b0c, 0 14px 30px -18px rgba(13, 148, 136, .55);
  --r: 16px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f8f7; --bg2: #e6f0ee; --surface: #ffffff; --surface2: #f7fbfa; --ink: #0f2a2a; --muted: #4b6563; --line: #d7e6e3; --line2: #bfd6d2;
  --primary: #0f766e; --primary-d: #115e59; --primary-soft: #ccfbf1; --on-primary: #ffffff; --fill: #0d9488;
  --gold: #b45309; --gold-l: #d97706; --gold-soft: #fef3c7;
  --red: #be123c; --red-soft: #ffe4e6;
  --ok: #15803d; --ok-soft: #dcfce7; --bad: #be123c; --bad-soft: #ffe4e6; --mid: #a16207; --mid-soft: #fef3c7;
  --st: #b45309; --g-die: #be123c;
  --glow: radial-gradient(1200px 600px at 85% -10%, rgba(13, 148, 136, .10), transparent 60%);
  --clay: 0 2px 0 var(--line2), 0 12px 26px -18px rgba(6, 78, 71, .35);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--primary); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; font-weight: 800; }
p { margin: 0 0 .6em; }
.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.22em; }
[lang="uk"], .ua { font-family: var(--serif); }
.st { color: var(--st); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.center { text-align: center; justify-content: center; }
kbd { font: 600 .7rem var(--sans); border: 1px solid var(--line2); border-radius: 5px; padding: 0 .35em; color: var(--muted); margin-left: .4em; }
@media (hover: none) { kbd { display: none; } }

/* ---------- Szkielet ---------- */
.app { display: flex; min-height: 100vh; }
.side { width: 250px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 0 12px 20px; }
.side::before { content: ''; display: block; height: 14px; margin: 0 -12px 14px; background: var(--emb) repeat-x center / auto 14px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 6px 8px 16px; text-decoration: none; color: var(--ink); }
.brand .ini { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: #fff; display: grid; place-items: center; font: 700 1.4rem var(--serif); box-shadow: inset 0 -5px 0 var(--gold-l); }
.brand b { display: block; font-weight: 800; line-height: 1.15; }
.brand small { color: var(--muted); font-size: .8rem; }
.nav a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 700; margin-bottom: 2px; }
.nav a:hover { background: var(--surface2); }
.nav a.on { background: var(--primary-soft); color: var(--primary-d); }
.col { flex: 1; min-width: 0; }
.status { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.status .lv { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: 1; max-width: 340px; min-width: 0; }
.status .lvn { font-weight: 700; white-space: nowrap; }
.status .bar { flex: 1; }
.pill { display: inline-flex; gap: 5px; align-items: center; padding: 4px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-size: .9rem; white-space: nowrap; }
.pill.hot { color: var(--red); }
.pill.goal.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.main { max-width: 920px; margin: 0 auto; padding: 24px 24px 60px; }
.bottomnav { display: none; }
@media (max-width: 860px) {
  .side { display: none; }
  .status { padding: 8px 16px; }
  .main { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  .bottomnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottomnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 700; border-radius: 12px; min-height: 48px; }
  .bottomnav a .ic { width: 24px; height: 24px; }
  .bottomnav a.on { color: var(--primary); background: var(--primary-soft); }
  h1 { font-size: 1.45rem; }
}

/* ---------- Elementy ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--clay); padding: 18px; margin-bottom: 16px; }
.card.note { background: var(--surface2); }
.card.warn { background: var(--gold-soft); border-color: transparent; }
.card.warn ul { padding-left: 1.2em; margin: .4em 0; }
.card.warn li { margin-bottom: .3em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; cursor: pointer; box-shadow: 0 3px 0 var(--line2); transition: transform .08s, box-shadow .08s, background .15s; }
.btn:hover { background: var(--surface2); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary-d); color: #fff; box-shadow: 0 3px 0 var(--primary-d); }
.btn.primary:hover { filter: brightness(1.07); }
:root[data-theme="dark"] .btn.primary { color: #0d1526; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0d1526; } }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--primary); }
.btn.danger { color: var(--bad); }
.btn.block { display: flex; width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0 16px; }
.bar { height: 10px; border-radius: 99px; background: var(--bg2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .4s; }
.bar.gold i { background: var(--gold-l); }
.bar.thin { height: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 800; padding: 2px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.tag .ic { width: 1em; height: 1em; }
.sim-t { background: var(--ok-soft); color: var(--ok); }
.sim-p { background: var(--primary-soft); color: var(--primary-d); }
.sim-f { background: var(--red-soft); color: var(--red); }
.sim-o { background: var(--gold-soft); color: var(--gold); }
.say { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--primary-soft); color: var(--primary-d); cursor: pointer; vertical-align: middle; flex: none; position: relative; }
.say.slow { width: auto; padding: 0 10px; border-radius: 99px; gap: 4px; display: inline-flex; align-items: center; }
.say.slow small { font-weight: 800; font-size: .72rem; }
.say.speaking, .say-chip.speaking { animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 25%, transparent); } }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line2); background: var(--surface); text-decoration: none; color: var(--ink); font-weight: 700; font-size: .9rem; cursor: pointer; min-height: 40px; }
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary-d); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.tr { display: block; font: italic .9rem var(--sans); color: var(--muted); }
.sec { margin: 26px 0 12px; }
.phead { margin-bottom: 18px; }
.phead .lead { color: var(--muted); max-width: 64ch; }
.backl { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-weight: 700; margin-bottom: 8px; min-height: 40px; }

/* ---------- Start ---------- */
.hero { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: center; margin-bottom: 18px; }
.kicker { text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; font-weight: 800; color: var(--red); margin-bottom: .3em; }
.hero h1 { font-family: var(--serif); font-size: 2.2rem; }
.lvcard { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--clay); padding: 14px 16px; }
.lvcard > div { flex: 1; display: grid; gap: 4px; }
.lvcard small { color: var(--muted); font-size: .82rem; }
.lvbadge { width: 52px; height: 52px; border-radius: 16px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; flex: none; }
.lvbadge .ic { width: 28px; height: 28px; }
.intro { border-left: 6px solid var(--gold-l); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dir { display: grid; gap: 10px; margin: 0; }
.dirh { display: flex; justify-content: space-between; align-items: baseline; }
.dirh h2 { margin: 0; }
.arrow { font-size: .8rem; font-weight: 800; color: var(--muted); background: var(--surface2); border-radius: 99px; padding: 2px 10px; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.nums b { display: block; font-size: 1.6rem; line-height: 1.1; }
.nums small { color: var(--muted); font-size: .78rem; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { display: grid; gap: 4px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--clay); text-decoration: none; color: var(--ink); transition: transform .12s; }
.tile:hover { transform: translateY(-2px); }
.tile .ic { width: 28px; height: 28px; color: var(--primary); margin-bottom: 4px; }
.tile small { color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bdg { display: grid; gap: 2px; justify-items: center; text-align: center; padding: 12px 8px; border-radius: 14px; border: 1px dashed var(--line2); color: var(--muted); opacity: .6; }
.bdg .ic { width: 26px; height: 26px; }
.bdg small { font-size: .74rem; line-height: 1.3; }
.bdg.got { opacity: 1; border: 1px solid transparent; background: var(--gold-soft); color: var(--ink); }
.bdg.got .ic { color: var(--gold); }
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .hero h1 { font-size: 1.8rem; }
  .duo { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr 1fr; }
}

/* ---------- Słówka ---------- */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.topic { display: grid; gap: 6px; text-decoration: none; color: var(--ink); margin: 0; }
.topic small { color: var(--muted); }
.tb { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; font-size: .75rem; color: var(--muted); }
.sessbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-weight: 800; color: var(--muted); font-size: .9rem; }
.sessbar .bar { flex: 1; }
.fc { text-align: center; position: relative; padding: 26px 18px; }
.fc .meta { color: var(--muted); font-size: .85rem; font-weight: 700; margin-bottom: 8px; }
.newtag { position: absolute; top: 12px; right: 12px; font-size: .72rem; font-weight: 800; background: var(--gold-soft); color: var(--gold); padding: 2px 10px; border-radius: 99px; }
.big { font-size: 2.3rem; line-height: 1.25; margin: 6px 0; }
.big .ua { font-size: inherit; }
.big .tr { font-size: 1rem; margin-top: 4px; }
.big.pl { font-family: var(--sans); font-weight: 800; font-size: 1.7rem; }
.bigish { font-size: 1.45rem; }
.sayrow { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
.back { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line2); display: grid; gap: 8px; justify-items: center; }
.back .pl { font-size: 1.35rem; font-weight: 800; }
.forms { color: var(--muted); font-size: 1rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.ex { background: var(--surface2); border-radius: 12px; padding: 10px 14px; width: 100%; }
.ex p { margin: 0 0 4px; }
.ex p[lang] { font-size: 1.12rem; }
.actions { margin-top: 4px; }
.actions.sticky { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 5; }
@media (min-width: 861px) { .actions.sticky { bottom: 16px; } }
.grades { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.grades .btn { flex-direction: column; gap: 0; min-height: 60px; }
.grades .btn small { font-weight: 600; color: var(--muted); font-size: .76rem; }
.grades .btn kbd { position: absolute; display: none; }
.grades .g1 { border-color: var(--bad); color: var(--bad); }
.grades .g3 { color: var(--mid); }
.grades .g4 { border-color: var(--primary); color: var(--primary-d); }
.grades .g5 { color: var(--ok); }
.ansrow { display: flex; gap: 8px; margin: 16px 0 10px; }
.answer { flex: 1; min-width: 0; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line2); background: var(--surface2); font: 1.35rem var(--serif); }
.answer:focus { outline: none; border-color: var(--primary); }
.verdict { padding: 8px 12px; border-radius: 12px; margin: 6px 0 8px; display: inline-block; }
.verdict.ok { background: var(--ok-soft); } .verdict.bad { background: var(--bad-soft); } .verdict.typo, .verdict.half { background: var(--mid-soft); }
.okc { color: var(--ok); } .badc { color: var(--bad); } .mid { color: var(--mid); }

/* klawiatura ekranowa */
.kb { display: grid; gap: 6px; margin: 6px auto 0; max-width: 620px; user-select: none; -webkit-user-select: none; }
.kb-row { display: flex; gap: 4px; justify-content: center; }
.key { flex: 1; max-width: 50px; min-height: 46px; padding: 0; border-radius: 9px; border: 1px solid var(--line2); background: var(--surface); box-shadow: 0 2px 0 var(--line2); font: 1.15rem var(--serif); cursor: pointer; touch-action: manipulation; }
.key:active { transform: translateY(2px); box-shadow: none; background: var(--primary-soft); }
.key.wide { max-width: 90px; flex: 1.6; font-family: var(--sans); font-weight: 800; font-size: 1rem; }
.key.space { max-width: 300px; flex: 5; font-family: var(--sans); font-size: .85rem; color: var(--muted); }
.key.ent { background: var(--primary); color: #fff; border-color: var(--primary-d); }
@media (max-width: 420px) { .kb-row { gap: 3px; } .key { min-height: 44px; font-size: 1.05rem; border-radius: 7px; } }

/* test wejściowy */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
.tw { display: grid; gap: 2px; padding: 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); cursor: pointer; text-align: left; min-height: 56px; }
.tw .ua { font-size: 1.2rem; }
.tw small { display: none; color: var(--ok); font-weight: 700; }
.tw.on { background: var(--ok-soft); border-color: var(--ok); }
.tw.on small { display: block; }

/* słownik */
.filters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.filters input, .filters select, .form input, .form select { min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); }
@media (max-width: 640px) { .filters { grid-template-columns: 1fr 1fr; } .filters input { grid-column: 1 / -1; } }
.wlist { display: grid; gap: 8px; }
.wrow { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.wmain { flex: 1; min-width: 0; }
.wmain .ua { font-size: 1.2rem; }
.wmain .pl { font-weight: 700; }
.wmain .forms { font-size: .9rem; }
.wside { display: grid; justify-items: end; gap: 6px; }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--bg2); border: 1px solid var(--line2); }
.dots i.l { background: var(--gold-l); } .dots i.k { background: var(--ok); }
@media (max-width: 520px) { .wside .tag { display: none; } }

/* fałszywi przyjaciele */
.ff { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.ffc { margin: 0; }
.ffh { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.ffh .tr { display: inline; margin-left: 6px; }
.eq { color: var(--ok); margin: 0; }
.neq { color: var(--red); }
.opts { display: grid; gap: 10px; margin: 10px 0; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { min-height: 54px; flex-direction: column; gap: 0; }
.opt small { color: var(--muted); font-weight: 600; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); opacity: 1; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); opacity: 1; }

/* wymowa */
.rules { display: grid; gap: 12px; }
.rule { margin: 0; }
.exs { display: flex; gap: 8px; flex-wrap: wrap; }
.say-chip .ua, .say-chip span { font-size: 1.1rem; }
.big-say { min-height: 56px; font-size: 1.1rem; }
.letters { display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; margin-top: 10px; }
.lt { font: 2.3rem/1.3 var(--serif); padding: 2px 3px; }
.lt.v { min-width: 48px; min-height: 60px; border-radius: 12px; border: 2px dashed var(--line2); background: var(--surface2); cursor: pointer; }
.lt.v:hover { border-color: var(--primary); }
.lt.v.right { background: var(--ok-soft); border: 2px solid var(--ok); color: var(--ok); }
.lt.v.wrong { background: var(--bad-soft); border: 2px solid var(--bad); color: var(--bad); }
.gap { color: var(--primary); border-bottom: 3px solid var(--primary); padding: 0 .1em; }

/* dialogi */
.dlist { display: grid; gap: 10px; }
.dl { display: flex; gap: 14px; align-items: center; text-decoration: none; color: var(--ink); margin: 0; }
.dl > .ic { width: 26px; height: 26px; color: var(--primary); }
.dl > div { flex: 1; display: grid; }

.num { width: 34px; height: 34px; border-radius: 10px; background: var(--primary-soft); color: var(--primary-d); display: grid; place-items: center; font-weight: 800; flex: none; }
.dctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.chatlog { display: grid; gap: 10px; margin: 16px 0; }
.bub { max-width: 82%; padding: 10px 14px 8px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--clay); transition: box-shadow .2s, transform .2s; }
.bub.r0 { justify-self: start; border-bottom-left-radius: 6px; }
.bub.r1 { justify-self: end; border-bottom-right-radius: 6px; background: var(--primary-soft); }
.bub.now { box-shadow: 0 0 0 3px var(--gold-l); transform: scale(1.01); }
.who { font-size: .78rem; font-weight: 800; color: var(--red); }
.utt { font-size: 1.2rem; line-height: 1.4; }
.plt { color: var(--muted); font-size: .92rem; margin-top: 2px; }
.reveal { border: 1px dashed var(--line2); background: transparent; border-radius: 10px; padding: 4px 12px; color: var(--muted); cursor: pointer; font: 700 .9rem var(--sans); }
.tools { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tb1 { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line2); background: var(--surface); border-radius: 99px; min-height: 36px; padding: 0 10px; cursor: pointer; color: var(--primary-d); }
.tb1 small { font-weight: 800; font-size: .72rem; }
.tb1.rec { background: var(--red); color: #fff; border-color: var(--red); animation: pulse 1s infinite; }
.srres { font-size: .88rem; margin-top: 4px; }
.yourturn { border: 2px solid var(--gold-l); }
@media (max-width: 520px) { .bub { max-width: 94%; } }

/* dyktando */
.dict { font-size: 1.3rem; line-height: 1.6; }
.okw { color: var(--ok); }
.badw { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }

/* gramatyka */
.lesson p { max-width: 70ch; }
.tbl { border-collapse: collapse; margin: 8px 0 14px; width: 100%; }
.tbl td { border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
.tbl td[lang] { font-size: 1.12rem; }
.tbl b { color: var(--red); }
.qz { margin-bottom: 12px; }
.qz .opts { grid-template-columns: 1fr; }
.qz .opt { align-items: flex-start; text-align: left; font-family: var(--serif); font-size: 1.1rem; font-weight: 500; }
.empty { text-align: center; padding: 30px 18px; }
.empty .row { justify-content: center; }

/* alfabet */
.abc { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.lt-tile { position: relative; display: grid; gap: 0; justify-items: center; padding: 10px 4px; border-radius: 14px; border: 1px solid var(--line2); background: var(--surface); box-shadow: 0 3px 0 var(--line2); cursor: pointer; min-height: 72px; }
.lt-tile b { font: 1.5rem var(--serif); }
.lt-tile small { color: var(--muted); font-size: .78rem; }
.lt-tile.seen { background: var(--surface2); }
.lt-tile.on { border-color: var(--primary); background: var(--primary-soft); }
.lt-tile .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.letter { display: flex; gap: 20px; align-items: center; }
.lbig { font: 4rem/1 var(--serif); color: var(--primary); min-width: 110px; text-align: center; }
.ipa { color: var(--muted); }
.exw { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.exw .tr { display: inline; }
@media (max-width: 520px) { .letter { flex-direction: column; text-align: center; } .exw { justify-content: center; } }

/* ustawienia */
.form { display: grid; gap: 12px; }
.form label { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 700; }
.form input[type=number] { width: 100px; }
.sw { display: flex; gap: 10px; align-items: center; font-weight: 700; cursor: pointer; min-height: 40px; }
.form .sw { justify-content: flex-start; }
.sw input { width: 20px; height: 20px; accent-color: var(--primary); }

/* toasty, konfetti */
#toasts { position: fixed; top: 64px; right: 16px; z-index: 100; display: grid; gap: 8px; pointer-events: none; }
.toast { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--primary); border-radius: 12px; padding: 10px 14px; box-shadow: var(--clay); display: grid; min-width: 220px; animation: tin .3s; }
.toast span { color: var(--muted); font-size: .88rem; }
.toast.badge, .toast.level { border-left-color: var(--gold-l); }
.toast.goal { border-left-color: var(--ok); }
.toast.out { opacity: 0; transform: translateX(20px); transition: .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-10px); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
@media (max-width: 860px) { #toasts { left: 16px; right: 16px; top: 56px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
:focus-visible { outline: 3px solid var(--gold-l); outline-offset: 2px; }

/* ============================================================
   Czarno-fioletowy: nadpisania i nowe elementy (ścieżka, trening, słuchanie)
   ============================================================ */
body { background: var(--glow), var(--bg); background-attachment: fixed; }
.side, .bottomnav { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); }

.btn.primary, :root[data-theme="dark"] .btn.primary { background: linear-gradient(135deg, var(--fill), #0f766e); border-color: transparent; color: #fff; box-shadow: 0 3px 0 #064e47, 0 10px 24px -12px #0d9488; }

a { color: var(--primary-d); }
.st { color: var(--st); }

/* ścieżka */
.lvl { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: var(--clay); }
.lvl.locked { opacity: .72; }
.lvlh { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.lvlh b { display: block; font-size: 1.05rem; }
.lvlh small { color: var(--muted); }
.lvtag { display: inline-grid; place-items: center; min-width: 46px; height: 32px; padding: 0 8px; border-radius: 10px; font: 800 .95rem var(--sans); color: #fff; vertical-align: middle; }
.lv-A1 { background: #064e47; } .lv-A2 { background: #0f766e; } .lv-B1 { background: #0f766e; } .lv-B2 { background: #0d9488; } .lv-C1 { background: #b45309; } .lv-C2 { background: linear-gradient(135deg, #0f766e, #f59e0b); }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.unode { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 14px 8px; border-radius: 16px; background: var(--surface2); border: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: transform .15s; }
.unode:hover:not(.lock) { transform: translateY(-2px); }
.unode .uname { font-weight: 800; line-height: 1.2; font-size: .95rem; }
.unode small { color: var(--muted); font-size: .78rem; }
.unode.lock { opacity: .55; }
.unode.cur { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(45, 212, 191, .35), 0 0 24px -6px #0d9488; }
.unode.done .rfg { stroke: var(--ok); }
.unode.text { border-style: dashed; }
.ring { position: relative; width: 58px; height: 58px; display: grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rbg { fill: none; stroke: var(--line2); stroke-width: 5; }
.ring .rfg { fill: none; stroke: url(#none); stroke: var(--gold-l); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .6s; }
.ring b { position: relative; font-size: .78rem; font-weight: 800; }
.ring.lockic { border-radius: 50%; background: var(--surface); border: 1px solid var(--line2); color: var(--muted); }
.ring.lockic .ic { width: 24px; height: 24px; }
.nextunit { display: flex; gap: 14px; align-items: center; text-decoration: none; color: var(--ink); }
.nextunit > div { flex: 1; } .nextunit b { display: block; font-size: 1.15rem; } .nextunit small { color: var(--muted); }
.nextunit .kicker { color: var(--gold); margin: 0; }
.unithead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.unithead .row { margin: 0; flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: center; box-shadow: var(--clay); }
.kpi b { display: block; font-size: 1.6rem; line-height: 1.1; background: linear-gradient(135deg, var(--primary-d), var(--gold-l)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kpi small { color: var(--muted); font-size: .8rem; }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

/* trening i pytania */
.qtitle { font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; margin-bottom: 8px; }
.opt { justify-content: flex-start; text-align: left; min-height: 54px; gap: 12px; }
.opt kbd { margin: 0; }
.opt .ua { font-size: 1.2rem; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); opacity: 1; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); opacity: 1; animation: shake .35s; }
.opt.pop { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { 40% { transform: scale(1.03); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.cloze { font-size: 1.35rem; line-height: 1.5; margin: 8px 0; }
.cloze .gap { display: inline-block; min-width: 4em; border-bottom: 3px solid var(--gold-l); color: var(--gold); text-align: center; margin: 0 .15em; }
.listenbox { display: flex; gap: 12px; justify-content: center; align-items: center; margin: 10px 0; }
.bigplay { width: 92px; height: 92px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 30% 30%, #2dd4bf, #0d9488 55%, #115e59); box-shadow: 0 0 0 8px rgba(13, 148, 136, .18), 0 14px 30px -10px #0d9488; transition: transform .1s; }
.bigplay:active { transform: scale(.96); }
.bigplay .ic { width: 40px; height: 40px; }
.bigplay.speaking { animation: pulse 1s infinite; }
.trq { font-size: 1.15rem; font-weight: 700; margin-top: 10px; }
.reveal { margin-top: 10px; padding: 14px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); display: grid; gap: 6px; justify-items: center; text-align: center; }
.reveal .pl { font-weight: 800; font-size: 1.1rem; }
.big.sm { font-size: 1.7rem; }
.introcard .bigpl { font-size: 1.4rem; font-weight: 800; margin: 6px 0; }
.introcard { border: 1px solid var(--primary); box-shadow: 0 0 0 1px rgba(45, 212, 191, .25), 0 0 40px -12px #0d9488; }
.verdict { display: block; text-align: center; font-size: 1.05rem; }
.verdict.bad { background: var(--bad-soft); } .verdict.ok { background: var(--ok-soft); }
.sessbar .combo { display: inline-flex; gap: 4px; align-items: center; color: #fb923c; font-weight: 800; animation: pulse 1s infinite; }
.xpfloat { position: fixed; z-index: 120; font-weight: 800; color: var(--gold); pointer-events: none; transform: translate(-50%, 0); animation: floatup 1.1s ease-out forwards; }
@keyframes floatup { to { transform: translate(-50%, -60px); opacity: 0; } }
.readtext { font-size: 1.2rem; line-height: 1.7; }
.qz .opt { min-height: 48px; }
@media (prefers-reduced-motion: reduce) { .bigplay, .sessbar .combo { animation: none; } }
.ring.lockic svg.ic { position: static; transform: none; width: 24px; height: 24px; inset: auto; }
@media (max-width: 520px) { .units { grid-template-columns: repeat(2, minmax(0, 1fr)); } .unode { padding: 12px 6px; } }

/* ============================================================
   Niemiecki: kolory rodzajników, ćwiczenia der/die/das
   ============================================================ */
.g-der { color: var(--g-der); font-weight: 800; }
.g-die { color: var(--g-die); font-weight: 800; }
.g-das { color: var(--g-das); font-weight: 800; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.artbtn { justify-content: center; min-height: 64px; }
.artopt { font-size: 1.35rem; }
.opt.right .artopt, .opt.wrong .artopt { filter: none; }

.tbl td .g-der, .tbl td .g-die, .tbl td .g-das { font-size: 1.05rem; }

/* ścieżki tematyczne i czasowniki nieregularne */
.lv-TR { background: linear-gradient(135deg, #2563eb, #0d9488); } .lv-AR { background: linear-gradient(135deg, #7c4a1e, #b45309); }
.lvtag { padding: 0 10px; }

.tipcard ul { margin: .3em 0 0; padding-left: 1.2em; } .tipcard li { margin: .35em 0; }

.vtab th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); background: var(--surface2); position: sticky; top: 0; }
.vtab td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.vtab td small { display: block; color: var(--muted); font-size: .8rem; }
.vtab tr:hover td { background: var(--surface2); }
.vchg { font-weight: 800; color: var(--gold-l); }
.vaux-ist { font-weight: 800; color: var(--g-die); } .vaux-hat { color: var(--muted); }
.vmini { margin: 6px auto; } .vmini td:first-child { color: var(--muted); }
@media (max-width: 640px) {
  .vtab thead { display: none; }
  .vtab tr { display: grid; grid-template-columns: 44px 1fr 1fr 24px; grid-template-areas: "s i i d" "s a b d" "s c c d"; gap: 2px 8px; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .vtab td { border: 0; padding: 0; }
  .vtab td:nth-child(1) { grid-area: s; } .vtab td:nth-child(2) { grid-area: i; } .vtab td:nth-child(3) { grid-area: a; } .vtab td:nth-child(4) { grid-area: b; } .vtab td:nth-child(5) { grid-area: c; } .vtab td:nth-child(6) { grid-area: d; }
  .vtab td[data-l]:not(:nth-child(2))::before { content: attr(data-l) ': '; color: var(--muted); font-size: .75rem; }
}

/* ============================================================
   Angielski: Oxford teal + bursztyn, Crimson Pro dla haseł
   ============================================================ */

.big { font-weight: 600; letter-spacing: -.005em; }

<script>
/* ============================================================
   ŚCIEŻKA OGÓLNA B1 → C2 (od poziomu średniozaawansowanego)
   W(angielski, część mowy, polski, formy/wymowa, podobieństwo, przykład, przykład PL)
   Część mowy: n – rzeczownik, v – czasownik, adj – przymiotnik, adv – przysłówek,
   pv – phrasal verb, phr – zwrot, idm – idiom, f – słowo funkcyjne / łącznik.
   Podobieństwo do polskiego: t – przezroczyste, p – podobne, f – fałszywy przyjaciel, o – obce.
   W przykładzie słowo docelowe w {…} (ćwiczenia z luką).
   ============================================================ */
var UA = window.UA || (window.UA = {});
UA.TOPICS = [];
UA.WORDS = [];
(function () {
  var cur;
  function L(level, id, name) { cur = id; UA.TOPICS.push({ id: id, name: name, level: level }); }
  function W(ua, pos, pl, forms, sim, ex, exPl) {
    UA.WORDS.push({ ua: ua, pos: pos, pl: pl, forms: forms || '', sim: sim, ex: ex || '', exPl: exPl || '', topic: cur });
  }

  /* ===================== B1 ===================== */
  L('B1', 'b1_people', 'Charakter i emocje');
  W('reliable', 'adj', 'niezawodny, solidny', '/rɪˈlaɪəbl/', 'o', 'She is the most {reliable} person on our team.', 'Ona jest najsolidniejszą osobą w naszym zespole.');
  W('stubborn', 'adj', 'uparty', '/ˈstʌbən/', 'o', 'My grandfather was too {stubborn} to ask for help.', 'Mój dziadek był zbyt uparty, żeby poprosić o pomoc.');
  W('shy', 'adj', 'nieśmiały', 'shier/shyer', 'o', 'He was {shy} at first, but then he opened up.', 'Na początku był nieśmiały, ale potem się otworzył.');
  W('generous', 'adj', 'hojny, szczodry', '/ˈdʒenərəs/', 'p', 'Thank you, that is very {generous} of you.', 'Dziękuję, to bardzo hojne z twojej strony.');
  W('anxious', 'adj', 'zaniepokojony, pełen obaw', '/ˈæŋkʃəs/', 'o', 'I always feel {anxious} before an exam.', 'Przed egzaminem zawsze się denerwuję.');
  W('embarrassed', 'adj', 'zawstydzony, zakłopotany', 'embarrassing – krępujący', 'o', 'I was so {embarrassed} when I forgot his name.', 'Było mi tak głupio, kiedy zapomniałem jego imienia.');
  W('disappointed', 'adj', 'rozczarowany', 'disappointing – rozczarowujący', 'o', 'The students were {disappointed} with their results.', 'Uczniowie byli rozczarowani wynikami.');
  W('proud of', 'phr', 'dumny z', '', 'o', 'We are very {proud of} you.', 'Jesteśmy z ciebie bardzo dumni.');
  W('jealous', 'adj', 'zazdrosny', '/ˈdʒeləs/', 'o', 'He gets {jealous} when she talks to other men.', 'Robi się zazdrosny, gdy ona rozmawia z innymi mężczyznami.');

  { id: 'reported', t: 'Mowa zależna',

  { id: 't_tr', level: 'TR', t: 'Weekend w Edynburgu', ua: 'A weekend in Edinburgh',
    text: 'Last spring we spent a long weekend in Edinburgh. We flew from Kraków and took the tram from the airport to the city centre. Our B&B was in a quiet street near the castle. On Saturday we walked up the Royal Mile and visited the castle, but it was so windy that we hid in a pub for lunch. On Sunday we climbed Arthur’s Seat. The view was amazing, although it started to rain on the way down.',
    pl: 'Zeszłej wiosny spędziliśmy długi weekend w Edynburgu. Polecieliśmy z Krakowa i z lotniska do centrum pojechaliśmy tramwajem. Nasz pensjonat był w cichej uliczce niedaleko zamku. W sobotę przeszliśmy Royal Mile i zwiedziliśmy zamek, ale tak wiało, że na lunch schowaliśmy się w pubie. W niedzielę weszliśmy na Arthur’s Seat. Widok był niesamowity, choć w drodze w dół zaczęło padać.',

  { id: 't_ar', level: 'AR', t: 'Listy z dywizjonu 303', ua: 'Letters from No. 303 Squadron',
    text: 'In the reading room at Kew I ordered a thin file of letters written by a Polish pilot to his English landlady in 1940. His English was imperfect, but the letters were full of warmth and humour. He thanked her for the cakes and joked about the British weather. The last letter is dated October 1940; a short note attached to it, written by his commanding officer, informed her that he had been killed in action. It was one of the most moving documents I have ever held.',
    pl: 'W czytelni w Kew zamówiłem cienką teczkę listów, które polski pilot pisał w 1940 roku do swojej angielskiej gospodyni. Jego angielski był niedoskonały, ale listy były pełne ciepła i humoru. Dziękował jej za ciasta i żartował z brytyjskiej pogody. Ostatni list jest datowany na październik 1940 roku; dołączona do niego krótka notatka dowódcy informowała ją, że zginął w walce. To był jeden z najbardziej poruszających dokumentów, jakie kiedykolwiek trzymałem w rękach.',

  { id: 't_b1', level: 'B1', t: 'Nowa praca', ua: 'Starting a new job',
    text: 'When Kasia moved to Bristol, she found a job in a small museum. At first she was anxious: she was afraid her English wasn’t good enough. Her colleagues, however, were friendly and patient. After a few weeks she started leading tours for school groups. The children loved her stories about the city’s past, and her boss soon put her in charge of the education programme.',
    pl: 'Kiedy Kasia przeprowadziła się do Bristolu, znalazła pracę w małym muzeum. Na początku się denerwowała: bała się, że jej angielski nie jest wystarczająco dobry. Koledzy byli jednak życzliwi i cierpliwi. Po kilku tygodniach zaczęła oprowadzać grupy szkolne. Dzieci uwielbiały jej opowieści o przeszłości miasta, a szef wkrótce powierzył jej program edukacyjny.',

  { id: 't_b2', level: 'B2', t: 'Turystyka a mieszkańcy', ua: 'Overtourism',

    var cand = shuffle(UA.WORDS.filter(function (x) { return x !== w && (!filter || filter(x)); }));
    cand.sort(function (a, b) { return score(b) - score(a); });
    function score(x) { return (x.pos === w.pos ? 2 : 0) + (lvOf(x) === lv ? 1 : 0) + (x.topic === w.topic ? 0.5 : 0); }
    var out = [];
    for (var i = 0; i < cand.length && out.length < n; i++) { var k = keyFn(cand[i]); if (!seenKeys[k] && k) { seenKeys[k] = 1; out.push(cand[i]); } }
    return out;
  }
  function mc(correct, others, keyFn) { var all = shuffle([correct].concat(others)); return { opts: all.map(keyFn), a: all.indexOf(correct) }; }
  function wordReveal(w) {
    return '<div class="reveal"><div class="big sm">' + uaw(w.ua) + '</div><div class="sayrow">' + sayBoth(w.ua) + '</div><div class="pl">' + esc(w.pl) + '</div>' + (w.ex ? '<div class="ex"><p lang="en">' + st(w.ex) + ' ' + say(w.ex) + '</p><p class="muted">' + esc(w.exPl) + '</p></div>' : '') + '</div>';
  }
  function exUa2pl(w) {
    var o = mc(w, pickOthers(w, function (x) { return x.pl; }, 3), function (x) { return esc(x.pl); });
    return { kind: 'ua2pl', dir: 'r', w: w, title: 'Co to znaczy?', prompt: '<div class="big">' + uaw(w.ua) + '</div><div class="sayrow">' + sayBoth(w.ua) + '</div>', say: w.ua, opts: o.opts, a: o.a, reveal: wordReveal(w) };
  }
  function exListen(w) {
    var o = mc(w, pickOthers(w, function (x) { return x.pl; }, 3), function (x) { return esc(x.pl); });
    return { kind: 'listen', dir: 'r', w: w, title: 'Posłuchaj – co to znaczy?', prompt: listenBtn(w.ua), say: w.ua, listen: true, opts: o.opts, a: o.a, reveal: wordReveal(w) };
  }
  function exSpell(w) {
    var len = strip(w.ua).length;
    var o = mc(w, pickOthers(w, function (x) { return strip(x.ua); }, 3, function (x) { return Math.abs(strip(x.ua).length - len) <= 3; }), function (x) { return '<span lang="en" class="ua">' + esc(strip(x.ua)) + '</span>'; });
    return { kind: 'spell', dir: 'r', w: w, title: 'Które słowo słyszysz?', prompt: listenBtn(w.ua), say: w.ua, listen: true, opts: o.opts, a: o.a, reveal: wordReveal(w) };
  }
  function exPl2ua(w) {
    var o = mc(w, pickOthers(w, function (x) { return strip(x.ua); }, 3), function (x) { return '<span lang="en" class="ua">' + st(x.ua) + '</span>'; });
    return { kind: 'pl2ua', dir: 'p', w: w, title: 'Jak to powiedzieć po angielsku?', prompt: '<div class="big pl">' + esc(w.pl) + '</div><div class="meta">' + esc(POS[w.pos] || '') + '</div>', opts: o.opts, a: o.a, sayAfter: w.ua, reveal: wordReveal(w) };
  }
  function exCloze(w) {
    var cz = w._cz; if (!cz) return null;
    var others = pickOthers(w, function (x) { return x._cz ? strip(x._cz.t).toLowerCase() : ''; }, 3, function (x) { return !!x._cz; });
    if (others.length < 3) return null;
    var all = shuffle([w].concat(others));
    return { kind: 'cloze', dir: 'p', w: w, title: 'Uzupełnij zdanie', prompt: '<p class="cloze" lang="en">' + st(cz.pre) + '<span class="gap">…</span>' + st(cz.post) + '</p><p class="muted">' + esc(w.exPl) + '</p>', opts: all.map(function (x) { return '<span lang="en" class="ua">' + st(x._cz.t) + '</span>'; }), a: all.indexOf(w), sayAfter: w.ex, reveal: wordReveal(w) };

    return { kind: 'art', dir: 'p', w: w, title: 'Który rodzajnik?', prompt: '<div class="big"><span class="gap">___</span> <span lang="en">' + esc(np.n) + '</span></div><div class="meta">' + esc(w.pl) + '</div>', opts: arts.map(function (a) { return '<span class="g-' + a + ' artopt">' + a + '</span>'; }), a: arts.indexOf(np.art), sayAfter: w.ua, reveal: wordReveal(w) };
  }
  function listenBtn(text) { return '<div class="listenbox"><button type="button" class="bigplay" data-say="' + esc(text) + '" aria-label="Odtwórz">' + ic('vol') + '</button><button type="button" class="say slow" data-say="' + esc(text) + '" data-rate="0.65" aria-label="Wolniej">' + ic('slow') + '<small>wolniej</small></button></div>'; }
  function chooseEx(e) {
    var w = e.w, c = SRS.card(w, e.dir), n = c ? c.n : 0, x;
    if (e.dir === 'r') {
      if (e.isNew || n === 0) return exUa2pl(w);
      if (n === 1) return exListen(w);
      return U.pick([exUa2pl, exListen, exSpell])(w);
    }
    if (e.followUp) return exCloze(w) || exPl2ua(w);
    if (n === 0) return exPl2ua(w);
    if (n === 1) return (nounParts(w) && Math.random() < .5 ? exArtikel(w) : exCloze(w)) || exPl2ua(w);
    var pool = w._cz ? [exCloze, exType, exPl2ua, exCloze] : [exType, exPl2ua]; if (nounParts(w)) pool.push(exArtikel, exArtikel);

  }

  /* ---------- Kolejka treningu ---------- */
  function buildQueue(scope) {
    var t = U.today(), inScope = scope === 'all' ? function () { return true; } : function (w) { return w.topic === scope; };
    var due = [], fresh = [];
    UA.WORDS.forEach(function (w) {
      if (!inScope(w)) return;
      ['r', 'p'].forEach(function (d) { var c = SRS.card(w, d); if (c && c.d <= t) due.push({ w: w, dir: d }); });
    });
    due = shuffle(due).slice(0, 50);
    var limR = scope === 'all' ? SRS.newLeft('r') : 12, limP = scope === 'all' ? SRS.newLeft('p') : 12;
    var order = scope === 'all' ? UA.TOPICS.filter(unlocked) : [unitById(scope)];
    order.forEach(function (u) { unitWords(u.id).forEach(function (w) { if (!SRS.card(w, 'r') && fresh.length < limR) fresh.push({ w: w, dir: 'r', isNew: true }); }); });
    var freshP = UA.WORDS.filter(function (w) { return inScope(w) && seen(w) && !SRS.card(w, 'p'); }).slice(0, limP).map(function (w) { return { w: w, dir: 'p', firstP: true }; });
    var q = [], i = 0, j = 0, k = 0;
    while (i < due.length || j < fresh.length || k < freshP.length) {
      if (i < due.length) q.push(due[i++]); if (i < due.length) q.push(due[i++]);
      if (j < fresh.length) q.push(fresh[j++]);
      if (k < freshP.length) q.push(freshP[k++]);
    }
    return q;
  }

  /* ============================================================
     WSPÓLNY WIDOK PYTANIA (ABCD) + combo
     ============================================================ */
  function askMC(stage, q, done) {
    stage.innerHTML = '<div class="card fc qcard"><p class="qtitle">' + esc(q.title) + '</p>' + q.prompt + '</div><div class="opts' + (q.opts.length === 2 ? ' two' : '') + '">' + q.opts.map(function (o, i) { return '<button class="btn opt" data-i="' + i + '"><kbd>' + (i + 1) + '</kbd><span>' + o + '</span></button>'; }).join('') + '</div><div id="fb"></div>';
    if (q.say && (q.listen || S.settings.autoplay)) setTimeout(function () { SP.speak(q.say); }, 250);
    var answered = false;
    function pick(i, b) {
      if (answered) return; answered = true;
      var ok = i === q.a;
      $$('.opt', stage).forEach(function (x) { x.disabled = true; if (+x.getAttribute('data-i') === q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong'); else b.classList.add('pop');
      G.sfx(ok ? 'ok' : 'bad');
      if (q.sayAfter) SP.speak(q.sayAfter);
      $('#fb', stage).innerHTML = '<div class="verdict ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? G.praise() : 'Niezupełnie.') + '</b></div>' + (q.reveal || '') + (q.extra || '') + '<button class="btn primary block" id="nx">Dalej <kbd>Enter</kbd></button>';
      $('#nx', stage).onclick = function () { done(ok, b); };
      $('#nx', stage).focus({ preventScroll: true });
      if (q.onAnswer) q.onAnswer(ok, b);
    }
    $$('.opt', stage).forEach(function (b) { b.onclick = function () { pick(+b.getAttribute('data-i'), b); }; });
    return function key(e) { var n = +e.key; if (n >= 1 && n <= q.opts.length) { var b = $$('.opt', stage)[n - 1]; if (b && !b.disabled) b.click(); } if (e.key === 'Enter') { var nx = $('#nx', stage); if (nx) { e.preventDefault(); nx.click(); } } };
  }
  function askType(stage, q, done) {
    var w = q.w, pair = w.ua.indexOf('/') > 0;
    stage.innerHTML = '<div class="card fc qcard"><p class="qtitle">' + esc(q.title) + '</p><div class="big pl">' + esc(w.pl) + '</div><div class="meta">' + esc(POS[w.pos] || '') + (pair ? ' – wpisz parę: niedokonany / dokonany' : '') + '</div>' +
      '<div class="ansrow"><input id="ans" class="answer" placeholder="po angielsku…"><button class="btn primary" id="chk">Sprawdź</button></div><div id="kbh"></div></div><div id="fb"></div>';
    var inp = $('#ans', stage), finished = false;
    $('#kbh', stage).appendChild(UA.KB(inp, check));
    if (!('ontouchstart' in window) || S.settings.sysKb) inp.focus();
    $('#chk', stage).onclick = check;
    function check() {
      if (finished) { var nx = $('#nx', stage); if (nx) nx.click(); return; }
      var a = norm(inp.value); if (!a) return;
      var exp = norm(w.ua.replace(/\s*\(Pl\.\)/, '')), ep = exp.split('/').map(function (s) { return s.trim(); }), ap = a.split(/\s*[\/,]\s*/).filter(Boolean);
      var ok = a === exp || (ap.length === ep.length && ap.every(function (x, k) { return x === ep[k]; }));
      var near = !ok && U.lev(a.replace(/\s*\/\s*/g, '/'), exp.replace(/\s*\/\s*/g, '/')) <= 1 && exp.length > 4;
      var np = nounParts(w), half = !ok && !near && np && (a === norm(np.n) || ['der', 'die', 'das'].some(function (r) { return r !== np.art && a === norm(r + ' ' + np.n); }));
      finished = true; inp.disabled = true; $('#kbh', stage).innerHTML = '';
      G.sfx(ok || near ? 'ok' : 'bad'); SP.speak(w.ua);
      var msg = ok ? '<b>' + G.praise() + '</b>' : near ? '<b>Prawie – literówka.</b> Zaliczam, ale popraw zapis.' : half ? (a === norm(np.n) ? '<b>Brakuje rodzajnika:</b> <span class="g-' + np.art + '">' + np.art + '</span>' : '<b>Zły rodzajnik.</b> Poprawnie: <span class="g-' + np.art + '">' + np.art + '</span>') : '<b>Niezupełnie.</b> Wpisałeś: <span lang="en">' + esc(inp.value) + '</span>';
      $('#fb', stage).innerHTML = '<div class="verdict ' + (ok ? 'ok' : near || half ? 'typo' : 'bad') + '">' + msg + '</div>' + q.reveal + '<button class="btn primary block" id="nx">Dalej <kbd>Enter</kbd></button>';
      $('#nx', stage).onclick = function () { done(ok || near, $('#chk', stage)); };

  /* ============================================================
     TRENING – nauka słów z automatycznym sprawdzaniem
     ============================================================ */
  V.trening = function (scope) {
    scope = scope || 'all';
    var u = scope === 'all' ? null : unitById(scope);
    var queue = buildQueue(scope), pos = 0, done = 0, okc = 0, combo = 0, best = 0, retries = {}, keyH = null;
    var back = u ? '#/etap/' + scope : '#/sciezka', title = u ? 'Trening: ' + u.name : 'Codzienny trening';
    if (!queue.length) {
      main.innerHTML = head(title, '', back) + '<section class="card empty"><h2>Na dziś wszystko!</h2><p>Brak powtórek i nowych słów w tym zakresie. Wróć jutro, zwiększ limit nowych słów w ustawieniach albo poćwicz słuchanie.</p><div class="row center"><a class="btn primary" href="#/sluchanie">Słuchanie</a><a class="btn" href="#/sciezka">Ścieżka</a></div></section>';
      return;
    }
    main.innerHTML = head(title, '', back) + '<div class="sessbar"></div><div id="stage"></div>';
    function onKey(e) { if (e.target.tagName === 'INPUT' && e.key !== 'Enter') return; if (keyH) keyH(e); }
    document.addEventListener('keydown', onKey);
    cleanup = function () { document.removeEventListener('keydown', onKey); };
    function bar2() { $('.sessbar').innerHTML = bar(pos, queue.length) + '<span>' + Math.min(pos + 1, queue.length) + '/' + queue.length + '</span>' + (combo >= 3 ? '<span class="combo">' + ic('flame') + combo + '</span>' : ''); }
    function next() {
      if (pos >= queue.length) return finish();
      bar2();
      var e = queue[pos];
      if (e.isNew && !e.shown) return intro(e);
      var q = chooseEx(e);
      keyH = (q.kind === 'type' ? askType : askMC)($('#stage'), q, function (ok, b) { result(e, ok, b); });
    }
    function intro(e) {
      e.shown = true; var w = e.w;
      $('#stage').innerHTML = '<div class="card fc introcard"><span class="newtag">nowe słowo</span><div class="meta">' + esc(POS[w.pos] || '') + ' · ' + lvLabel(lvOf(w)) + '</div><div class="big">' + uaw(w.ua) + '</div><div class="sayrow">' + sayBoth(w.ua) + '</div><div class="pl bigpl">' + esc(w.pl) + '</div>' +
        (w.forms ? '<div class="forms" lang="en">' + st(w.forms) + '</div>' : '') + '<div class="tags"><span class="tag ' + SIM[w.sim][1] + '">' + SIM[w.sim][0] + '</span></div>' +
        (w.ex ? '<div class="ex"><p lang="en">' + st(w.ex) + ' ' + say(w.ex) + '</p><p class="muted">' + esc(w.exPl) + '</p></div>' : '') + '</div><div class="actions"><button class="btn primary block" id="gotit">Zapamiętane – sprawdź mnie <kbd>Enter</kbd></button></div>';
      if (S.settings.autoplay) SP.speak(w.ua);
      $('#gotit').onclick = next;
      keyH = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); next(); } };
    }
    function result(e, ok, b) {
      var isNewCard = !SRS.card(e.w, e.dir);
      if (isNewCard) SRS.countNew(e.dir);
      SRS.grade(e.w, e.dir, ok ? 4 : 1);
      done++;
      if (ok) {
        okc++; combo++; best = Math.max(best, combo);
        var mult = 1 + Math.min(2, Math.floor(combo / 4)), r = b ? b.getBoundingClientRect() : null;
        G.addXP(1);
        if (r) floatXP('+1', r.left + r.width / 2, r.top);
        if (e.dir === 'p') { S.stats.prodOk++; G.save(); }
        // nowe słowo: drugie sprawdzenie w tej samej sesji, ale w innej formie (zdanie z luką / PL → UA)
        if (e.isNew && !SRS.card(e.w, 'p')) queue.splice(Math.min(queue.length, pos + 4), 0, { w: e.w, dir: 'p', followUp: true });
      } else {
        combo = 0;
        var k = SRS.wid(e.w) + e.dir; retries[k] = (retries[k] || 0) + 1;
        if (retries[k] <= 2) queue.splice(Math.min(queue.length, pos + 3), 0, { w: e.w, dir: e.dir });
      }
      pos++; next();
    }
    function finish() {
      keyH = null; document.removeEventListener('keydown', onKey);
      var pct = done ? Math.round(100 * okc / done) : 0;
      $('.sessbar').innerHTML = '';
      $('#stage').innerHTML = '<section class="card empty"><h2 lang="en">' + st(pct >= 80 ? 'Brilliant!' : 'Well done!') + '</h2><p>' + done + ' odpowiedzi, ' + pct + '% poprawnych · najdłuższa seria: ' + best + '.</p><p class="muted">Kolejne powtórki aplikacja zaplanowała sama – na podstawie tego, jak Ci poszło.</p><div class="row center"><a class="btn primary" href="#/sciezka">Ścieżka</a><a class="btn" href="#/sluchanie">Słuchanie</a></div></section>';
      if (pct >= 80 && done >= 6) G.confetti();
      G.checkBadges();
    }
    next();
  };
  function floatXP(text, x, y) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var el = document.createElement('div'); el.className = 'xpfloat'; el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 1100);
  }

  /* ============================================================
     RUNDA PYTAŃ (testy lekcji, słuchanie)
     ============================================================ */
  function runMC(o) {
    var items = o.items.filter(Boolean), k = 0, good = 0, combo = 0, keyH = null;
    main.innerHTML = head(esc(o.title), o.sub || '', o.back) + '<div class="sessbar"></div><div id="stage"></div>';
    function onKey(e) { if (e.target.tagName === 'INPUT') return; if (keyH) keyH(e); }
    document.addEventListener('keydown', onKey);
    cleanup = function () { document.removeEventListener('keydown', onKey); };
    function show() {
      if (k >= items.length) return end();
      $('.sessbar').innerHTML = bar(k, items.length) + '<span>' + (k + 1) + '/' + items.length + '</span>' + (combo >= 3 ? '<span class="combo">' + ic('flame') + combo + '</span>' : '');
      var q = items[k];
      keyH = askMC($('#stage'), q, function (ok, b) {
        if (ok) { good++; combo++; var r = b.getBoundingClientRect(); G.addXP(1, r.left, r.top); floatXP('+1', r.left + r.width / 2, r.top); if (o.counter) { S.stats[o.counter] = (S.stats[o.counter] || 0) + 1; G.save(); } }
        else combo = 0;
        k++; show();
      });
    }
    function end() {
      keyH = null; document.removeEventListener('keydown', onKey);
      $('.sessbar').innerHTML = '';
      var extra = o.onEnd ? o.onEnd(good, items.length) || '' : '';
      $('#stage').innerHTML = '<section class="card empty"><h2>' + good + '/' + items.length + '</h2>' + extra + '<div class="row center"><a class="btn primary" href="' + o.back + '">Wróć</a>' + (o.again ? '<button class="btn" id="again">Jeszcze raz</button>' : '') + '</div></section>';
      if (good === items.length && items.length >= 8) G.confetti();
      if (o.again) $('#again').onclick = o.again;
      G.checkBadges();
    }
    show();
  }

  /* ============================================================
     SŁUCHANIE
     ============================================================ */
  function listenPool(lv) {
    if (lv === 'moje') { var m = UA.WORDS.filter(seen); return m.length >= 12 ? m : levelWords('TR'); }
    return levelWords(lv);
  }
  function defaultLv() { var lv = 'TR'; LEVELS.forEach(function (l) { if (THEME[l]) return; if (levelUnlocked(l) && levelWords(l).some(seen)) lv = l; }); return lv; }
  V.sluchanie = function (mode, lv) {
    lv = lv || defaultLv();
    if (mode) return listenRun(mode, lv);
    var vs = SP.voiceStatus();
    var h = head('Słuchanie', 'Aplikacja czyta na głos słowa, zdania i teksty – Ty sprawdzasz, czy zrozumiałeś. Przycisk „wolniej” odtwarza nagranie w tempie 0,65×.');

    h += '<section class="tiles">' + [
      ['slowa', 'headphones', 'Usłysz i zrozum', 'słowo → tłumaczenie'], ['pisownia', 'pen', 'Pisownia ze słuchu', 'które słowo słyszysz?'],
      ['zdania', 'chat', 'Zdania', 'co znaczy usłyszane zdanie?'], ['prawda', 'check', 'Prawda czy fałsz?', 'czy tłumaczenie pasuje?']
    ].map(function (t) { return '<a class="tile" href="#/sluchanie/' + t[0] + '/' + lv + '">' + ic(t[1]) + '<b>' + t[2] + '</b><small>' + t[3] + ' · ' + (lv === 'moje' ? 'moje słowa' : lvLabel(lv)) + '</small></a>'; }).join('') + '</section>';
    h += '<h2 class="sec">Czytanki ze słuchu</h2><section class="dlist">' + (UA.TEXTS || []).map(function (t) {
      var okL = levelUnlocked(t.level), sc = S.stats.texts[t.id];
      return '<a class="card dl" href="#/czytanka/' + t.id + '"><span class="lvtag lv-' + t.level + '\">' + lvLabel(t.level) + '</span><div><b>' + esc(t.t) + '</b><small lang="en">' + st(t.ua) + (okL ? '' : ' · poziom jeszcze zablokowany – możesz spróbować') + '</small></div>' + (sc != null ? '<span class="tag sim-t">' + sc + '/3</span>' : '') + '</a>';
    }).join('') + '</section>';
    h += '<h2 class="sec">Więcej ze słuchu</h2><section class="row"><a class="btn" href="#/dyktando">' + ic('pen') + 'Dyktando</a><a class="btn" href="#/wymowa/pary/lang">' + ic('ear') + 'Długie i krótkie samogłoski</a><a class="btn" href="#/dialogi">' + ic('chat') + 'Dialogi</a></section>';
    main.innerHTML = h;
  };
  function listenRun(mode, lv) {
    var pool = listenPool(lv), items = [], back = '#/sluchanie//' + lv;
    var withEx = pool.filter(function (w) { return w.ex; });
    if (mode === 'slowa') items = shuffle(pool).slice(0, 10).map(exListen);
    if (mode === 'pisownia') items = shuffle(pool).slice(0, 10).map(exSpell);
    if (mode === 'zdania') items = shuffle(withEx).slice(0, 8).map(function (w) {
      var others = pickOthers(w, function (x) { return x.exPl; }, 3, function (x) { return !!x.ex; }), all = shuffle([w].concat(others));
      return { title: 'Co znaczy usłyszane zdanie?', prompt: listenBtn(w.ex), say: w.ex, listen: true, opts: all.map(function (x) { return esc(x.exPl); }), a: all.indexOf(w), reveal: '<div class="ex"><p lang="en">' + st(w.ex) + ' ' + say(w.ex) + '</p><p class="muted">' + esc(w.exPl) + '</p></div>' };

    var pool = UA.WORDS.filter(function (w) { var s = bare(w); return s.indexOf(' ') < 0 && s.length >= 3 && s.length <= 11 && ['phr', 'idm', 'pv'].indexOf(w.pos) < 0 && /^[a-z]+$/i.test(bare(w)); });
    var k = 0, good = 0, N = 10;
    main.innerHTML = head('Usłysz i wybierz zapis', 'Posłuchaj słowa i wybierz, jak się je pisze. Angielska pisownia bywa zdradliwa – to ćwiczenie oswaja z nią ucho.', '#/alfabet') + '<div class="sessbar"></div><div id="stage"></div>';
    function q() {
      if (k >= N) { $('#stage').innerHTML = '<section class="card empty"><h2>' + good + '/' + N + '</h2><div class="row"><button class="btn primary" id="again">Jeszcze raz</button><a class="btn" href="#/alfabet">Dźwięki</a></div></section>'; $('#again').onclick = abcQuiz; return; }
      var w = U.pick(pool), right = bare(w);
      var others = U.shuffle(pool.filter(function (x) { return x !== w && Math.abs(bare(x).length - right.length) <= 2 && bare(x)[0].toLowerCase() === right[0].toLowerCase(); }).concat(U.shuffle(pool).slice(0, 6))).map(bare).filter(function (t, i, a) { return t !== right && a.indexOf(t) === i; }).slice(0, 3);
      var opts = U.shuffle([right].concat(others));
      $('.sessbar').innerHTML = bar(k, N) + '<span>' + (k + 1) + '/' + N + '</span>';
      $('#stage').innerHTML = '<div class="card fc qcard">' + listenBtn(right) + '</div><div class="opts">' + opts.map(function (o) { return '<button class="btn opt" data-o="' + esc(o) + '"><span lang="en" class="ua">' + esc(o) + '</span></button>'; }).join('') + '</div><div id="fb"></div>';
      setTimeout(function () { SP.speak(right); }, 250);
      $$('.opt').forEach(function (b) {
        b.onclick = function () {
          $$('.opt').forEach(function (x) { x.disabled = true; if (x.getAttribute('data-o') === right) x.classList.add('right'); });
          if (b.getAttribute('data-o') === right) { good++; G.addXP(1); G.sfx('ok'); } else { b.classList.add('wrong'); G.sfx('bad'); }
          SP.speak(right);
          $('#fb').innerHTML = '<p class="center">' + uaw(w.ua) + ' – ' + esc(w.pl) + '</p><button class="btn primary block" id="nx">Dalej</button>'; $('#nx').onclick = function () { k++; q(); };
        };
      });
    }
    q();
  }

  /* ============================================================
     WIĘCEJ (menu na telefonie) i USTAWIENIA
     ============================================================ */
  V.wiecej = function () {
    main.innerHTML = head('Więcej') + '<section class="dlist">' + NAV.filter(function (n) { return !n[3]; }).map(function (n) {
      return '<a class="card dl" href="#/' + n[0] + '">' + ic(n[2]) + '<div><b>' + n[1] + '</b></div>' + ic('next') + '</a>';
    }).join('') + '</section>';
  };
  V.ustawienia = function () {
    var s = S.settings, vs = SP.voiceStatus();
    var h = head('Ustawienia');
    h += '<section class="card form">' +
      '<label>Nowe słowa dziennie <input type="number" id="npd" min="0" max="50" value="' + s.newPerDay + '"></label>' +
      '<label>Cel dzienny (XP) <input type="number" id="goal" min="10" max="500" step="10" value="' + s.goal + '"></label>' +
      '<label>Akcent głosu <select id="acc"><option value="GB"' + (s.accent !== 'US' ? ' selected' : '') + '>brytyjski (en-GB)</option><option value="US"' + (s.accent === 'US' ? ' selected' : '') + '>amerykański (en-US)</option></select></label>' +
      '<label class="sw"><input type="checkbox" id="ap"' + (s.autoplay ? ' checked' : '') + '> Automatycznie czytaj słowo na karcie</label>' +
      '<label class="sw"><input type="checkbox" id="kb"' + (s.sysKb ? ' checked' : '') + '> Używaj klawiatury systemowej</label>' +
      '<label class="sw"><input type="checkbox" id="snd"' + (s.sound ? ' checked' : '') + '> Dźwięki</label>' +
      '<label>Tempo mowy <select id="rate"><option value="0.75"' + (s.rate < 1 ? ' selected' : '') + '>0,75×</option><option value="1"' + (s.rate >= 1 ? ' selected' : '') + '>1×</option></select></label>' +
      '<label>Motyw <select id="th"><option value="">ciemny (Oxford teal)</option><option value="light"' + (s.theme === 'light' ? ' selected' : '') + '>jasny</option></select></label></section>';
    h += '<section class="card"><h2>' + ic('vol') + ' Głos</h2><p>' + (vs.ok ? 'Używany głos: <b>' + esc(vs.name) + '</b>' : esc(vs.msg)) + '</p><button class="btn" data-say="Hello! This is the English language.">' + ic('play') + ' Test głosu</button></section>';
    if (!vs.ok) h += voiceHelp(vs);
    h += '<section class="card"><h2>Postęp</h2><p class="muted">Postęp jest zapisany tylko w tej przeglądarce. Zrób kopię, żeby przenieść go na inne urządzenie.</p><div class="row"><button class="btn" id="exp">Eksportuj (plik)</button><label class="btn">Importuj<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn danger" id="rst">Wyzeruj wszystko</button></div></section>';
    h += '<section class="card note"><h2>O treściach</h2><p>Słownictwo: ' + UA.WORDS.length + ' słów w ' + UA.TOPICS.length + ' lekcjach (B1–C2 + „Podróż” i „Archiwum i historia”), ' + UA.VERBS.length + ' czasowników nieregularnych, ' + (UA.TEXTS || []).length + ' czytanek, ' + UA.FRIENDS.length + ' fałszywych przyjaciół, ' + UA.DIALOGS.length + ' dialogów, ' + UA.GRAMMAR.length + ' lekcji gramatyki. Angielski brytyjski z uwagami o amerykańskim (pisownia i słownictwo).</p><p><b>Ważne:</b> treść przygotowano bez udziału native speakera. Przykłady i dialogi warto skonsultować z anglistą – tego nie zastąpi ani model językowy, ani synteza mowy.</p></section>';
    main.innerHTML = h;
    function upd(k, v) { s[k] = v; G.save(); }
    $('#npd').onchange = function () { upd('newPerDay', Math.max(0, Math.min(50, +this.value || 0))); };
    $('#goal').onchange = function () { upd('goal', Math.max(10, +this.value || 30)); renderStatus(); };
    $('#acc').onchange = function () { upd('accent', this.value); SP.reloadVoices(); route(); };
    $('#ap').onchange = function () { upd('autoplay', this.checked); };
    $('#kb').onchange = function () { upd('sysKb', this.checked); };
    $('#snd').onchange = function () { upd('sound', this.checked); };
    $('#rate').onchange = function () { upd('rate', +this.value); };
    $('#th').onchange = function () { upd('theme', this.value); applyTheme(); };
    $('#exp').onclick = function () {
      var blob = new Blob([JSON.stringify(S)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'angielski-postep-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
    };
    $('#imp').onchange = function () {
      var f = this.files[0]; if (!f) return;
      f.text().then(function (t) { var o = JSON.parse(t); if (!o.srs) throw 0; localStorage.setItem(G.KEY, JSON.stringify(o)); location.reload(); }).catch(function () { G.toast('Nieprawidłowy plik', 'To nie jest kopia postępu z tej aplikacji'); });
    };
    $('#rst').onclick = function () { if (confirm('Na pewno usunąć cały postęp? Tego nie da się cofnąć.')) { localStorage.removeItem(G.KEY); location.reload(); } };
  };

  function applyTheme() { document.documentElement.setAttribute('data-theme', S.settings.theme === 'light' ? 'light' : 'dark'); var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', S.settings.theme === 'light' ? '#f4f8f7' : '#081a1c'); }
  applyTheme();
  route();
})();

</script>
</body>
</html>
